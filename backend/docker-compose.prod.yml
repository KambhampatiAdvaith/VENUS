services:
  postgres:
    image: postgres:16-alpine
    container_name: venus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-venus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venus}
      POSTGRES_DB: ${POSTGRES_DB:-venus_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-venus} -d ${POSTGRES_DB:-venus_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: venus-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: venus-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: venus-zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://venus-kafka:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: venus-kafka-init
    depends_on:
      - kafka
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo 'Waiting for Kafka to be ready...';
      sleep 25;

      kafka-topics --bootstrap-server venus-kafka:29092 --create --if-not-exists --topic venus.telemetry --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server venus-kafka:29092 --create --if-not-exists --topic venus.faults --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server venus-kafka:29092 --create --if-not-exists --topic venus.alerts --partitions 3 --replication-factor 1;
      kafka-topics --bootstrap-server venus-kafka:29092 --create --if-not-exists --topic venus.load-balancing --partitions 3 --replication-factor 1;

      echo 'Kafka topics created successfully.';
      kafka-topics --bootstrap-server venus-kafka:29092 --list;
      "

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: venus-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

  init-db:
    build:
      context: .
      dockerfile: Dockerfile
    image: venus-backend
    container_name: venus-init-db
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - backend.database.init_db
    environment:
      POSTGRES_HOST: venus-postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-venus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venus}
      POSTGRES_DB: ${POSTGRES_DB:-venus_db}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: venus-backend
    container_name: venus-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
      kafka:
        condition: service_started
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: venus-postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-venus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-venus}
      POSTGRES_DB: ${POSTGRES_DB:-venus_db}

      KAFKA_BOOTSTRAP_SERVERS: venus-kafka:29092
      ENABLE_KAFKA_TELEMETRY_CONSUMER: ${ENABLE_KAFKA_TELEMETRY_CONSUMER:-true}
      ENABLE_KAFKA_FAULT_CONSUMER: ${ENABLE_KAFKA_FAULT_CONSUMER:-false}

      MQTT_HOST: venus-mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  mqtt-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    image: venus-backend
    container_name: venus-mqtt-bridge
    restart: unless-stopped
    depends_on:
      - kafka
      - mosquitto
    command:
      - python
      - -m
      - backend.mqtt.mqtt_to_kafka_bridge
    environment:
      KAFKA_BOOTSTRAP_SERVERS: venus-kafka:29092
      MQTT_HOST: venus-mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}

  substation-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: venus-backend
    container_name: venus-substation-a
    restart: unless-stopped
    depends_on:
      - mosquitto
    command:
      - python
      - -m
      - simulator.substation_a
    environment:
      MQTT_HOST: venus-mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}

  substation-b:
    build:
      context: .
      dockerfile: Dockerfile
    image: venus-backend
    container_name: venus-substation-b
    restart: unless-stopped
    depends_on:
      - mosquitto
    command:
      - python
      - -m
      - simulator.substation_b
    environment:
      MQTT_HOST: venus-mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}

  substation-c:
    build:
      context: .
      dockerfile: Dockerfile
    image: venus-backend
    container_name: venus-substation-c
    restart: unless-stopped
    depends_on:
      - mosquitto
    command:
      - python
      - -m
      - simulator.substation_c
    environment:
      MQTT_HOST: venus-mosquitto
      MQTT_PORT: ${MQTT_PORT:-1883}

volumes:
  postgres_data:
